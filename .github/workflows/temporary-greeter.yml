name: Temporary FreeBSD greeter check

on:
  workflow_dispatch:
  push:
    branches: [ci/noctalia-greeter-freebsd]

permissions:
  contents: read

concurrency:
  group: temporary-greeter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and log in on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          release: '15.1'
          arch: x86_64
          usesh: true
          mem: 8192
          cpu: 2
          copyback: true
          cache-after-prepare: true
          # Binaries are unchanged since 62cfbf4; refresh the PAM policy below.
          prepare: |
            # Native build key: ed7eadb189706e01502f78f3b8514ab117d8979b67538111b5844caf9c3dc7d1
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            pkg update -f
            pkg install -y python3 jq xorg-vfbserver xdotool mesa-dri mesa-libs
            cc -Wall -Wextra tests/temporary-greetd-socket.c -o /tmp/temporary-greetd-socket
            /tmp/temporary-greetd-socket
            sh tests/temporary-greeter-build.sh
          run: |
            set +x
            awk '
              /write_file.*\/etc\/pam.d\/greetd\)/ { policy = 1; next }
              policy && /^EOF$/ { exit }
              policy { print }
            ' install.sh > /etc/pam.d/greetd
            CI_LOGIN_PASSWORD=$(openssl rand -hex 20)
            printf '%s\n' "$CI_LOGIN_PASSWORD" | pw usermod ci-login -h 0
            export CI_LOGIN_PASSWORD
            if sh tests/temporary-greeter-login.sh; then
              login_status=0
            else
              login_status=$?
            fi
            mkdir -p ci-reports
            cp -R /tmp/freebsd-greeter-ci/. ci-reports/
            printf '%s\n' "$login_status" >ci-reports/exit-status
            exit 0
      - name: Check login result
        run: test "$(cat ci-reports/exit-status)" = 0
      - name: Save synthetic CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-greeter-reports
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 3
